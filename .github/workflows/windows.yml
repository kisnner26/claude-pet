name: windows
on:
  push:
    paths: ['windows/**', '.github/workflows/windows.yml']
  pull_request:
    paths: ['windows/**', '.github/workflows/windows.yml']
jobs:
  tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: protocol and named pipe tests
        shell: pwsh
        run: |
          $env:PYTHONPATH = 'windows'
          python -m unittest discover -s windows/tests -v
  package:
    needs: tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: install packaging tool
        run: python -m pip install pyinstaller==6.22.3
      - name: build and verify executables
        run: python windows/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: claude-pet-windows
          path: build/windows/claude-pet-windows.zip
          if-no-files-found: error
